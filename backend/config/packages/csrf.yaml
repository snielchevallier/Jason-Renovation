# CSRF classique (session), sur tous les formulaires, y compris EasyAdmin.
#
# La recipe symfony/form active par defaut un CSRF "stateless" (jeton signe,
# sans session) qui exige un controleur JavaScript pour injecter le vrai jeton
# au moment du submit. Notre back-office est deja protege par une session
# (firewall "admin") : le CSRF stateless n'apporte rien ici et rend le
# formulaire invalidable sans JS (ce qui a casse la connexion a l'installation
# d'EasyAdmin). On reste donc en CSRF de session pour tous les formulaires.
framework:
    form:
        csrf_protection:
            token_id: submit
